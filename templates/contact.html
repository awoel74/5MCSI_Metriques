<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <style>
    /* Styles de base et arrière-plan */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      /* Arrière-plan en dégradé animé (mode sombre) */
      background: linear-gradient(-45deg, #0F2027, #203A43, #2C5364, #203A43);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Conteneur du formulaire (style glassmorphism) */
    form {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      background-clip: padding-box;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    form h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.5rem;
      text-align: center;
    }

    /* Styles des champs du formulaire */
    .name-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .name-fields input {
      flex: 1 1 0;
      min-width: 0;
    }
    input[type="email"], textarea {
      width: 100%;
      margin-bottom: 1rem;
    }
    input[type="text"], input[type="email"], textarea {
      transition: border-color 0.3s;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 1rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 0.5rem 0;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    /* Effet au survol des champs */
    input:hover, textarea:hover {
      border-bottom-color: rgba(255, 255, 255, 0.8);
    }
    /* Effet au focus des champs */
    input:focus, textarea:focus {
      border-bottom-color: #1abc9c;
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Bouton d'envoi */
    .submit-btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      cursor: pointer;
      color: #ffffff;
      background: #1abc9c;
      border: none;
      border-radius: 5px;
      margin: 0 auto;
      transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
      user-select: none;
      outline: none;
      display: block;
    }
    .submit-btn:hover {
      background-color: #17a489;
      box-shadow: 0 0 10px #1abc9c;
      transform: translateY(-2px);
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <!-- Formulaire de contact en mode sombre avec design moderne -->
  <form action="#" method="post">
    <h2>Contactez-nous</h2>
    <div class="name-fields">
      <input type="text" name="nom" placeholder="Nom" required />
      <input type="text" name="prenom" placeholder="Prénom" required />
    </div>
    <input type="email" name="email" placeholder="Email" required />
    <textarea name="message" placeholder="Message" required></textarea>
    <button type="submit" class="submit-btn">Envoyer</button>
  </form>
</body>
</html>
